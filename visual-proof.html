<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>烟花与雨｜静态视觉校样</title>
<style>body{margin:0;background:#15131b;color:#fff;font-family:system-ui,sans-serif}header{padding:18px;text-align:center}h1{font-size:20px;margin:0 0 8px}p{font-size:13px;color:#c8c5d5;margin:0}nav{display:flex;justify-content:center;gap:10px;margin:15px}button{border:1px solid #9c8ab5;background:#332d3d;color:#fff;border-radius:20px;padding:8px 18px;cursor:pointer}button[aria-pressed=true]{background:#ed4e9c}.stage{width:min(90vw,480px);margin:0 auto 30px;aspect-ratio:1536/2730;background:#050505;overflow:hidden;box-shadow:0 10px 30px #0008}svg{display:block;width:100%;height:100%}</style></head><body><header><h1>烟花与雨 · 静态视觉校样</h1><p>独立绘制的材质与构图初稿；用于确认视觉，不代表最终动效。</p><nav><button id="fire" aria-pressed="true">烟花构图</button><button id="rain" aria-pressed="false">雨与水花</button></nav></header><div class="stage"><svg id="scene" viewBox="0 0 1536 2730" xmlns="http://www.w3.org/2000/svg"></svg></div><script>
const svg=document.querySelector('#scene'), NS='http://www.w3.org/2000/svg';
function el(tag,attrs={},parent=svg){let e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e}
function defs(){const d=el('defs');const colors={pink:'#fb4b9e',red:'#f23759',mint:'#68e7bd',yellow:'#ffe964',purple:'#b77bea',blue:'#25aafb',cyan:'#82e4f2',white:'#f7f6ff',dark:'#08607c'};for(const [name,color] of Object.entries(colors)){let g=el('radialGradient',{id:name,cx:'32%',cy:'23%',r:'75%'},d);el('stop',{offset:'0%', 'stop-color':'#fff','stop-opacity':'.88'},g);el('stop',{offset:'24%','stop-color':color},g);el('stop',{offset:'70%','stop-color':color},g);el('stop',{offset:'100%','stop-color':'#311b59','stop-opacity':'.85'},g)}let filter=el('filter',{id:'shadow',x:'-30%',y:'-30%',width:'160%',height:'160%'},d);el('feDropShadow',{dx:'3',dy:'8',stdDeviation:'7','flood-opacity':'.5'},filter)}
function group(x,y,scale=1){return el('g',{transform:`translate(${x} ${y}) scale(${scale})`,filter:'url(#shadow)'})}
function ball(g,x,y,r,c){el('circle',{cx:x,cy:y,r,fill:`url(#${c})`},g)}
function capsule(g,x,y,w,h,c,angle=0){el('rect',{x:x-w/2,y:y-h/2,width:w,height:h,rx:w/2,fill:`url(#${c})`,transform:`rotate(${angle} ${x} ${y})`},g)}
function radial(x,y,r,kind){let g=group(x,y);let colors=kind==='mint'?['mint']:kind==='red'?['red']:kind==='purple'?['purple','white']:['pink','mint','purple','red'];let n=kind==='mint'?24:kind==='red'?18:kind==='purple'?19:24;for(let i=0;i<n;i++){let a=i*360/n;capsule(g,0,-r*.70,r*.105,r*.48,colors[i%colors.length],0);g.lastChild.setAttribute('transform',`rotate(${a})`)}if(kind!=='purple'){for(let i=0;i<n;i++){let a=(i+.5)*360/n;capsule(g,0,-r*.43,r*.060,r*.46,kind==='mint'?'mint':kind==='red'?'red':i%2?'mint':'yellow');g.lastChild.setAttribute('transform',`rotate(${a})`)}}ball(g,0,0,r*.16,kind==='mint'?'mint':kind==='red'?'red':kind==='purple'?'purple':'yellow')}
function disc(x,y,r){let g=group(x,y);let path='';for(let i=0;i<80;i++){let a=i*Math.PI*2/80,rr=r*(i%4===0?1.08:i%4===2?.96:1.02);path+=(i?'L':'M')+Math.cos(a)*rr+' '+Math.sin(a)*rr}el('path',{d:path+'Z',fill:'url(#blue)'},g);for(let [rr,c] of [[.84,'blue'],[.68,'purple'],[.37,'dark'],[.30,'white'],[.24,'dark'],[.19,'white'],[.14,'dark']])ball(g,0,0,r*rr,c);ball(g,0,0,r*.10,'mint')}
function star(x,y,r,c,n=12){let g=group(x,y),p='';for(let i=0;i<n*2;i++){let a=i*Math.PI/n-Math.PI/2,rr=i%2?r*.43:r;p+=`${Math.cos(a)*rr},${Math.sin(a)*rr} `}el('polygon',{points:p,fill:`url(#${c})`},g)}
function checker(x,y,r){let g=group(x,y);for(let ring=0;ring<3;ring++){let outer=r*(1-ring*.18),inner=r*(1-(ring+1)*.18);for(let i=0;i<20;i++){let a=i*Math.PI/10,b=(i+1)*Math.PI/10;let d=`M ${Math.cos(a)*outer} ${Math.sin(a)*outer} A ${outer} ${outer} 0 0 1 ${Math.cos(b)*outer} ${Math.sin(b)*outer} L ${Math.cos(b)*inner} ${Math.sin(b)*inner} A ${inner} ${inner} 0 0 0 ${Math.cos(a)*inner} ${Math.sin(a)*inner} Z`;el('path',{d,fill:(i+ring)%2?'#fcf1f0':'#ed4f91'},g)}}ball(g,0,0,r*.42,'dark');ball(g,0,0,r*.25,'mint')}
function gear(x,y,r,c){let g=group(x,y);for(let i=0;i<10;i++){el('rect',{x:-r*.25,y:-r,width:r*.5,height:r*.66,rx:r*.1,fill:`url(#${c})`,transform:`rotate(${i*36})`},g)}ball(g,0,0,r*.66,c);el('rect',{x:-r*.21,y:-r*.21,width:r*.42,height:r*.42,rx:8,transform:'rotate(45)',fill:'url(#purple)'},g)}
function crystal(x,y,r){let g=group(x,y);for(let i=0;i<8;i++){let p=`0,-${r*.2} -${r*.18},-${r*.65} 0,-${r} ${r*.17},-${r*.65}`;el('polygon',{points:p,fill:i%2?'url(#pink)':'url(#cyan)',transform:`rotate(${i*45})`},g)}ball(g,0,0,r*.23,'purple')}
function fire(){svg.replaceChildren();defs();disc(340,340,220);radial(1250,300,195,'multi');let g=group(300,940);for(let i=0;i<26;i++)capsule(g,0,-215,38,100,'pink',i*360/26);ball(g,0,0,200,'purple');checker(315,900,100);checker(235,986,75);gear(775,800,105,'cyan');gear(1055,790,100,'pink');radial(590,1170,130,'red');checker(952,1150,100);checker(882,1230,72);star(1204,1250,95,'mint');radial(1175,1460,110,'mint');star(355,1455,66,'yellow');crystal(704,1500,120);star(605,1780,85,'purple');checker(1160,1960,105);checker(1080,2050,76);radial(775,2190,190,'multi');radial(332,2390,180,'purple');radial(1250,2450,215,'mint');let dots=[['cyan',500,500],['mint',735,470],['pink',818,1040],['blue',780,315],['mint',393,1300],['purple',1030,1540],['pink',680,1720],['cyan',1250,1650],['mint',445,1870],['blue',1420,1530],['yellow',511,1110]];for(const [c,x,y] of dots)ball(svg,x,y,10,c)}
function rain(){svg.replaceChildren();defs();let drops=[[145,605,45],[730,235,48],[815,390,38],[714,590,44],[1350,930,48],[610,925,35],[770,1120,45],[155,1260,44],[300,1650,45],[850,1870,48],[1375,1760,43]];for(const [x,y,r] of drops){let g=group(x,y);el('path',{d:`M 0 ${-r*1.8} C ${r*.3} ${-r*.8} ${r} ${-r*.1} ${r} ${r*.55} A ${r} ${r} 0 0 1 ${-r} ${r*.55} C ${-r} ${-r*.1} ${-r*.3} ${-r*.8} 0 ${-r*1.8} Z`,fill:'url(#cyan)'},g)}for(let i=0;i<18;i++){let x=35+(i*211)%1480,y=120+(i*313)%2050;capsule(svg,x,y,24,210+(i%3)*60,'cyan')}for(let [x,y] of [[250,2530],[540,2360],[1000,2520],[1300,2370]]){let g=group(x,y);for(let [rx,ry,c] of [[160,68,'mint'],[125,50,'purple'],[90,34,'cyan']])el('ellipse',{cx:0,cy:0,rx,ry,fill:`url(#${c})`},g);for(let i=0;i<5;i++){let a=(i-2)*22;capsule(g,0,-55,18,110,'cyan',a)}ball(g,0,-95,16,'cyan')}}
document.querySelector('#fire').onclick=()=>{fire();document.querySelector('#fire').setAttribute('aria-pressed','true');document.querySelector('#rain').setAttribute('aria-pressed','false')};document.querySelector('#rain').onclick=()=>{rain();document.querySelector('#rain').setAttribute('aria-pressed','true');document.querySelector('#fire').setAttribute('aria-pressed','false')};fire();
</script></body></html>
