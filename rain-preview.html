<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>高饱和蓝色雨滴 · 动效预览</title><style> *{box-sizing:border-box}body{margin:0;background:#000;color:white;font:14px system-ui;display:grid;min-height:100vh;place-items:center}main{text-align:center}canvas{display:block;width:min(78vw,380px);height:min(83vh,675px);background:#000}p{color:#999;font-size:12px;letter-spacing:.05em}</style></head><body><main><canvas id="rain"></canvas><p>参考图原始水滴轮廓 · 饱和蓝色 · 无雨线</p></main><script type="module">import {WeatherEffects} from './effects.mjs?v=33'; const canvas=document.querySelector('canvas');const fx=new WeatherEffects(canvas,false);function resize(){const r=canvas.getBoundingClientRect();fx.resize(r.width,r.height)}window.addEventListener('resize',resize);resize();fx.rain=1;let last=0;function tick(now){fx.step(Math.min(.033,(now-(last||now-16))/1000),now,true,null,false,false);last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></body></html>
