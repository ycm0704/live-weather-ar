<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直播背景颜色测试</title><style>
*{box-sizing:border-box}body{margin:0;background:#15131b;color:#fff;font:14px system-ui}header{text-align:center;padding:12px}button{padding:8px 15px;margin:4px;background:#4c3d69;color:white;border:0;border-radius:20px}#stage{position:relative;width:min(92vw,400px);aspect-ratio:9/16;margin:auto;background:#000;overflow:hidden}#bg,canvas{position:absolute;inset:0;width:100%;height:100%}#bg{object-fit:cover}p{color:#ccc;margin:5px}
</style></head><body><header><strong>直播背景颜色测试</strong><p>切换图 3 / 图 4 和烟花 / 雨；移动鼠标模拟头部位置。</p><button id="three">图 3</button><button id="four">图 4</button><button id="fire">烟花</button><button id="rain">雨</button></header><div id="stage"><img id="bg" src="./color-test/scene-3.jpeg" alt="直播背景"><canvas id="rain-canvas"></canvas><canvas id="fire-canvas"></canvas></div><script src="./firework-composition.js?v=10"></script><script type="module">
import {WeatherEffects} from './effects.mjs?v=30';
const stage=document.querySelector('#stage'),background=document.querySelector('#bg'),rainCanvas=document.querySelector('#rain-canvas'),fireCanvas=document.querySelector('#fire-canvas');
const fire=globalThis.createFireworkComposition(fireCanvas,{transparent:true,autoplay:false,loop:true,interactive:false});const rain=new WeatherEffects(rainCanvas,false);let mode='fire',head=null,last=0;
function resize(){const r=stage.getBoundingClientRect();rain.resize(r.width,r.height);fire.resize()}new ResizeObserver(resize).observe(stage);resize();
function selectMode(value){mode=value;if(value==='fire'){fire.trigger()}else{fire.stop()} }const params=new URLSearchParams(location.search);if(params.get('scene')==='4')background.src='./color-test/scene-4.jpeg';selectMode(params.get('effect')==='rain'?'rain':'fire');
document.querySelector('#three').onclick=()=>background.src='./color-test/scene-3.jpeg';document.querySelector('#four').onclick=()=>background.src='./color-test/scene-4.jpeg';document.querySelector('#fire').onclick=()=>selectMode('fire');document.querySelector('#rain').onclick=()=>selectMode('rain');
stage.addEventListener('pointermove',e=>{const b=stage.getBoundingClientRect();head={x:e.clientX-b.left,y:e.clientY-b.top,rx:b.width*.11,ry:b.height*.09};fire.setHead(head)});stage.addEventListener('pointerleave',()=>{head=null;fire.setHead(null)});
function tick(now){rain.step(Math.min(.033,(now-(last||now-16))/1000),now,mode==='rain',head,false,false);last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
